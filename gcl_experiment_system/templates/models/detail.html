{% extends "base.html" %}
{% block title %}Model {{ method.display_name }}{% endblock %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h3>{{ method.display_name }}</h3>
    <p>{{ method.description }}</p>
    <h5>Architecture</h5>
    <p>{{ method.architecture }}</p>
    <h5>Key Parameters</h5>
    <div class="d-flex flex-wrap gap-2">
      {% for param in method.key_parameters %}
        <span class="badge text-bg-secondary">{{ param }}</span>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
